    <h2>给未来的自己</h2>
    <div class="meta">作者：宇昕 · 七年级</div>
    <div class="content">
      <p>十年后的你，还记得今天写下的这句话吗？我想告诉你，现在的我，正在为了一道数学题抓耳挠腮，正在操场上迎着风奔跑，正在日记本上写下对未来的期许。</p>
      <p>我不知道现在的你，是否已经考上了理想的大学，是否去看了那片海。但我希望，不管走多远，你都别忘了今天这个坐在台灯下、心里有光的自己。</p>
