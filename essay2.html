    <h2>那盏灯</h2>
    <div class="meta">作者：宇昕 · 七年级</div>
    <div class="content">
      <p>每晚回家，巷口那盏路灯总是亮着。昏黄的光晕打在青石板上，拉长了我的影子。起初，我以为那是物业装的路灯，直到那个冬天的晚上。</p>
      <p>那天风很大，我缩着脖子往家走。远远地，我看见邻居奶奶正踩着小板凳，费力地换着灯泡。我跑过去扶住她，问：“奶奶，这是您家的灯吗？”</p>
      <p>她笑着摇摇头：“不是，这巷子深，你们放学晚，没灯看不清路，我顺手开着。”那一刻，风依然冷，但那盏灯，突然就暖到了心里。</p>
