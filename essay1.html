    <h2>春天的第一场雨</h2>
    <div class="meta">作者：宇昕 · 七年级 · 2026年3月</div>
    
    <div class="content">
      <p>雨滴敲在窗上，像谁在轻轻叩门。我放下笔，看见院子里那棵老树，它的枝头终于冒出了星星点点的绿意。</p>
      <p>这是春天的第一场雨。我推开窗，空气里混着泥土的腥气和一种说不出的清甜。小雨点落在屋檐上，汇成细流，滴滴答答地往下落。</p>
      <p>我忽然想起去年秋天，这棵树落光了叶子，像个孤独的老人。但现在，雨正在唤醒它。这大概就是春天的力量吧，不管冬天多漫长，总有雨来敲门。</p>
